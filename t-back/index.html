<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tback</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    grid-template-rows: 5rem 1fr 11rem;
    place-items: center;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 35%, #3d2b24, #211612);
    color: #fff5e4;
  }

  #sign {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ffca64;
    text-shadow: 0 2px 0 #1a100c;
  }

  #next, #stage { grid-area: 2 / 1; }

  #stage {
    z-index: 1;
    display: flex;
    width: 100%;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }

  .slot {
    flex: 0 0 100%;
    display: grid;
    place-items: center;
    scroll-snap-align: center;
    scroll-snap-stop: always;
  }

  .card {
    display: grid;
    place-items: center;
    width: min(64vw, 16rem);
    aspect-ratio: 3 / 4;
    font-size: 7rem;
    font-weight: 800;
    background: #fff7e8;
    color: #2b1c15;
    border: 4px solid #2b1c15;
    border-radius: 1.6rem;
    box-shadow: 0 1.1rem 2rem rgb(0 0 0 / 0.4);
  }

  #card {
    animation: tilt linear both;
    animation-timeline: view(x);
  }

  @keyframes tilt {
    from { rotate: 25deg; background: #d6f5c9; }
    50%  { rotate: 0deg;  background: #fff7e8; }
    to   { rotate: -25deg; background: #ffd2c4; }
  }

  footer {
    display: grid;
    gap: 0.75rem;
    justify-items: center;
    align-content: start;
    height: 100%;
    padding-top: 0.5rem;
  }

  #streak, #last {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
  }
  #streak::before { content: "streak "; opacity: 0.65; }
  #last::before { content: "last result "; opacity: 0.65; }

  #settings {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 0.4rem;
    width: min(92vw, 22rem);
  }
  #settings button:nth-child(-n + 3) { grid-column: span 3; }

  button {
    padding: 0.45rem 0;
    font: inherit;
    font-weight: 700;
    color: #fff5e4;
    background: #4e372e;
    border: 2px solid #2b1c15;
    border-radius: 0.75rem;
    box-shadow: 0 0.25rem 0 #2b1c15;
    cursor: pointer;
  }
  button[aria-pressed="true"] {
    background: #ffbe4f;
    color: #2b1c15;
    transform: translateY(0.15rem);
    box-shadow: 0 0.1rem 0 #2b1c15;
  }
</style>
</head>
<body>
<p id="sign"></p>
<div id="next" class="card"></div>
<div id="stage">
  <div class="slot"></div>
  <div class="slot"><div id="card" class="card"></div></div>
  <div class="slot"></div>
</div>
<footer>
  <p id="streak"></p>
  <p id="last"></p>
  <div id="settings"></div>
</footer>
<script src="tback.js"></script>
</body>
</html>
